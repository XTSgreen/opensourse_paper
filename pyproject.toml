[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-benchmark"
version = "0.1.0"
description = "Auditable benchmarks for identifiable inverse optimal transport in single-cell dynamics"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
models = ["scikit-learn>=1.3", "torch>=2.0"]
figures = ["matplotlib>=3.8", "pyarrow>=14"]
test = ["pytest>=8.0", "scikit-learn>=1.3", "torch>=2.0", "matplotlib>=3.8", "pyarrow>=14"]

[project.scripts]
iot-benchmark = "iot_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
